name: auto-iterate-project
version: 1.6.0
description: "Autonomous project iteration skill: analyze a git repo, pick high-value improvements, implement small verified changes, commit, and loop until goals or budgets are met. Triggers: auto-iterate, autonomous iteration, continuous improvement, keep improving this project, full-auto development, 全自动迭代这个项目, 自动改进并提交这个仓库, 自动推进项目改进."
interface:
  display_name: "Auto Iterate Project"
  short_description: "Automatically analyze, improve, test, and commit git projects."
  default_prompt: "Use the $auto-iterate-project skill to autonomously improve this git project; for Chinese requests, say 全自动迭代这个项目。支持定时器：迭代到明天早上 8 点（init --deadline '08:00' 或 '+8h' 等），也支持按轮次/分钟/token 预算停止。"
