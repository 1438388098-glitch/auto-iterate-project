<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto·iterate 观察台</title>
<style>
  :root {
    --bg: #0A0A0B; --surface: #131316; --surface2: #1A1A1F;
    --line: #232329; --txt: #EDEDEF; --txt2: #9A9AA2; --txt3: #5C5C66;
    --accent: #7EE0B8; --accent-dim: rgba(126,224,184,.14);
    --warm: #E8A87C;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F0F0EE; --line:#E4E4E0;
      --txt:#1A1A1A; --txt2:#5A5A62; --txt3:#98989E;
      --accent:#0E8A64; --accent-dim:rgba(14,138,100,.10); --warm:#C77A3A;
    }
  }
  :root[data-theme="light"] {
    --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F0F0EE; --line:#E4E4E0;
    --txt:#1A1A1A; --txt2:#5A5A62; --txt3:#98989E;
    --accent:#0E8A64; --accent-dim:rgba(14,138,100,.10); --warm:#C77A3A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body {
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
    padding:32px 44px 48px; max-width:1280px; margin:0 auto;
  }
  .mono { font-family:"Cascadia Code",Consolas,monospace; }

  /* ---- 顶栏 ---- */
  .topbar { display:flex; align-items:baseline; gap:20px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .brand { font-size:17px; font-weight:650; letter-spacing:-.2px; }
  .brand em { font-style:normal; color:var(--txt3); font-weight:400; }
  .topmeta { font-size:12px; color:var(--txt2); display:flex; gap:16px; margin-left:auto; align-items:center; }
  .live { color:var(--accent); }
  .live::before {
    content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-right:6px; vertical-align:1px;
    animation:breath 2.8s ease-in-out infinite;
  }
  @keyframes breath { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .mode { font-size:10.5px; color:var(--txt2); border:1px solid var(--line); border-radius:99px; padding:3px 12px; background:none; font-family:inherit; }
  .mode b { color:var(--txt); font-weight:500; }
  button.mode { cursor:pointer; transition:border-color 200ms, color 200ms; }
  button.mode:hover { border-color:var(--txt3); color:var(--txt); }

  /* ---- 统计行 ---- */
  .stats { display:flex; gap:56px; padding:24px 0 26px; }
  .stat .n { font-size:24px; font-weight:600; letter-spacing:-.4px; white-space:nowrap; }
  .stat .n small { font-size:13px; color:var(--txt3); font-weight:400; }
  .stat .l { font-size:9.5px; letter-spacing:1.8px; color:var(--txt3); text-transform:uppercase; margin-top:3px; }

  /* ---- 主区 ---- */
  /* 布局逻辑：左=状态侧（生长树+回放+态势小卡，整列 sticky），
     右=叙事侧（时间线长内容）。两列都内容自适应高度，互不为对方留白。
     minmax(0,·) 压掉 auto 最小宽度：nowrap 省略行不得把对侧挤瘪 */
  .main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:start; }
  .main > * { min-width:0; }
  .side {
    position:sticky; top:20px; align-self:start;
    display:flex; flex-direction:column; gap:16px;
    max-height:calc(100vh - 40px); overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .panel { background:var(--surface); border-radius:12px; padding:22px 24px; }
  .panel h3 { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--txt3); font-weight:600; white-space:nowrap; }
  .gran { font-size:9.5px; color:var(--txt3); border:1px solid var(--line); border-radius:99px; padding:2px 9px; font-weight:400; letter-spacing:.5px; }
  .panel-tree { display:flex; flex-direction:column; }
  .tree-cap { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .tree-cap > div:first-child { display:flex; align-items:center; gap:10px; }
  #tree { width:100%; }
  svg { display:block; width:100%; }
  #tree .drow { cursor:pointer; }
  #tree g.domain { transition:opacity 200ms cubic-bezier(.22,1,.36,1); }
  #tree .drow:hover text { fill:var(--txt); }
  #tree text { transition:fill 200ms cubic-bezier(.22,1,.36,1); }
  .halo { animation:halo 2.8s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity:.5; } 50% { opacity:.06; } }

  /* ---- 态势小卡（趋势/方向/目标/回顾/事件）：数据在场才显形 ---- */
  .panel-story h3 { margin-bottom:6px; }
  .sec { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  #status-panel .sec:first-child { margin-top:0; padding-top:0; border-top:none; }
  .sec h3 .cnt { color:var(--txt3); letter-spacing:0; text-transform:none; font-size:10px; margin-left:6px; }
  #events { border-left:2px solid var(--line); margin-left:6px; }
  .ev { position:relative; padding:11px 2px 13px 18px; }
  .ev::before {
    content:""; position:absolute; left:-24px; top:17px; width:7px; height:7px; border-radius:50%;
    background:var(--surface); border:1.5px solid var(--txt3);
    transition:background 200ms, border-color 200ms;
  }
  .ev.hot::before { background:var(--accent); border-color:var(--accent); }
  .ev.dim { opacity:.55; }
  .ev .meta { font-size:10px; color:var(--txt3); margin-bottom:3px; }
  .ev .t {
    font-size:13.5px; font-weight:600; letter-spacing:-.1px; margin-bottom:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ev .s {
    font-size:11.5px; color:var(--txt2); line-height:1.5;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .flush { display:flex; align-items:center; gap:12px; padding:7px 2px 7px 18px; color:var(--txt3); font-size:9.5px; letter-spacing:1.2px; }
  .flush i { flex:1; height:1px; background:var(--line); }

  /* ---- 目标 / 回顾 / 运行事件 ---- */
  .goal-line { display:flex; align-items:center; gap:10px; }
  .goal-line > span:first-child { font-size:11.5px; color:var(--txt2); flex:none; }
  .goalbar { flex:1; height:3px; background:var(--surface2); border-radius:2px; overflow:hidden; }
  .goalbar i { display:block; height:100%; background:var(--accent); border-radius:2px; transition:width 400ms cubic-bezier(.22,1,.36,1); }
  .goal-line .goalmeta { font-size:10px; color:var(--txt3); flex:none; }
  #retro-excerpt {
    font-size:11px; color:var(--txt2); line-height:1.7; white-space:pre-wrap;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  #events-log { font-size:10px; color:var(--txt3); line-height:1.9; }
  #events-log .err { color:var(--warm); }
  .dirrow { display:flex; gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--surface2); font-size:11.5px; }
  .dirrow:last-child { border-bottom:none; }
  .dirrow .ve { color:var(--txt3); font-size:10px; flex:none; }
  .dirrow .ty { margin-left:auto; color:var(--txt3); font-size:10px; flex:none; }

  /* ---- 回放条（树面板底部：随卡片停靠，永不悬浮遮内容） ---- */
  .replay {
    flex:none; display:flex; align-items:center; gap:14px;
    margin-top:12px; padding-top:14px; border-top:1px solid var(--line);
  }
  .play {
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface2); color:var(--txt); cursor:pointer; font-size:10px;
    display:flex; align-items:center; justify-content:center; flex:none;
    transition:border-color 200ms, color 200ms;
  }
  .play:hover { border-color:var(--accent); color:var(--accent); }
  .axis { flex:1; height:3px; background:var(--surface2); border-radius:2px; position:relative; touch-action:none; }
  .axis .fill { position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--accent); opacity:.35; }
  .axis .cursor {
    position:absolute; top:50%; transform:translate(50%,-50%); width:11px; height:11px; border-radius:50%;
    background:var(--bg); border:2px solid var(--accent);
  }
  .axislbl { font-size:11px; color:var(--txt3); flex:none; }

  /* ---- 无运行状态 ---- */
  #norun {
    min-height:62vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; color:var(--txt3);
  }
  #norun .dot { width:10px; height:10px; border-radius:50%; background:var(--txt3); opacity:.6; }
  #norun .msg { font-size:14px; color:var(--txt2); }
  #norun .hint { font-size:11px; }

  /* ---- 生长动画：新节点/卡片浮现（只动 opacity/transform） ---- */
  @keyframes grow-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* 单列（≤1000）：状态侧与叙事侧纵向堆叠，sticky 侧栏退化为自然流 */
  @media (max-width: 1000px) {
    body { padding: 24px 20px 44px; }
    .main { grid-template-columns: minmax(0,1fr); }
    .side { position:static; max-height:none; overflow:visible; }
  }

  /* 顶栏/统计行（≤800）：允许换行不溢出，meta 整行落到品牌下方 */
  @media (max-width: 800px) {
    .topbar { flex-wrap:wrap; row-gap:10px; }
    .topmeta { flex-wrap:wrap; margin-left:0; width:100%; gap:10px 14px; }
    .stats { flex-wrap:wrap; gap:20px 32px; padding:18px 0 20px; }
  }

  /* 手机宽度（≤520）：字阶、内边距、回放条整体收敛 */
  @media (max-width: 520px) {
    body { padding: 18px 14px 36px; }
    .panel { padding: 16px 14px; border-radius:10px; }
    .stats { gap: 16px 24px; }
    .stat .n { font-size:20px; }
    .brand { font-size:15.5px; }
    .replay { gap:10px; }
    .play { width:28px; height:28px; }
    .axislbl { font-size:10px; }
    .ev { padding-left:14px; }
  }
  /* 动效降级——全文件唯一的全局声明处，新增动画/过渡无需另写 reduce 分支 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div id="norun" hidden>
    <div class="dot"></div>
    <div class="msg">没有正在观察的运行</div>
    <div class="hint mono">autopilot init 后自动出现</div>
  </div>

  <div id="stage">
    <div class="topbar">
      <div class="brand">auto·iterate <em>观察台</em></div>
      <div class="topmeta mono">
        <span id="stat-runid" style="color:var(--txt3)"></span>
        <span class="live" id="stat-phase">—</span>
        <span id="stat-version" style="color:var(--txt3)"></span>
        <button id="theme-toggle" class="mode" title="切换主题">主题</button>
      </div>
    </div>

    <div class="stats mono">
      <div class="stat"><div class="n" id="stat-rounds-big">—</div><div class="l">轮次</div></div>
      <div class="stat"><div class="n" id="stat-completed">—</div><div class="l">完成</div></div>
      <div class="stat"><div class="n" id="stat-scale">—</div><div class="l">生长规模</div></div>
      <div class="stat"><div class="n" id="stat-tokens" title="变更当量：按代码变更行数×12 + 二进制文件×100 + 每轮基础值500 估算的代理值，非 LLM 真实 token 消耗">—</div><div class="l">变更当量</div></div>
    </div>

    <div class="main">
      <div class="side">
        <section class="panel panel-tree">
          <div class="tree-cap">
            <div><h3>项目生长</h3><span class="gran" id="gran-tag" hidden></span></div>
            <span class="mode"><b id="mode-label">当前</b></span>
          </div>
          <div class="tree-wrap"><div id="tree"></div></div>
          <div class="replay" id="replay" hidden>
            <button class="play" id="play" title="回放">▶</button>
            <div class="axis" id="axis"><div class="fill" id="axis-fill"></div><div class="cursor" id="axis-cursor"></div></div>
            <div class="axislbl mono" id="axis-label">r1 — r1</div>
          </div>
        </section>

        <section class="panel" id="status-panel" hidden>
          <div class="sec" id="trend-sec" hidden>
            <h3>趋势</h3>
            <div id="trend"></div>
          </div>
          <div class="sec" id="dir-sec" hidden>
            <h3>迭代方向<span class="cnt mono" id="dir-cnt"></span></h3>
            <div id="directions"></div>
          </div>
          <div class="sec" id="goal-sec" hidden>
            <div class="goal-line">
              <span id="goal-label"></span>
              <div class="goalbar"><i id="goal-fill"></i></div>
              <span id="goal-side" class="goalmeta mono"></span>
            </div>
          </div>
          <div class="sec" id="retro-sec" hidden>
            <h3>回顾</h3>
            <div id="retro-excerpt" class="mono"></div>
          </div>
          <div class="sec" id="log-sec" hidden>
            <h3>运行事件</h3>
            <div id="events-log" class="mono"></div>
          </div>
        </section>
      </div>

      <section class="panel panel-story">
        <h3>进化叙事</h3>
        <div id="events"></div>
      </section>
    </div>
  </div>

  <script>
(function () {
  var root = document.documentElement;
  // 主题：localStorage 优先；?theme= 供无头截图/分享直链测试
  var param = new URLSearchParams(window.location.search).get("theme");
  var saved = param === "light" || param === "dark" ? param : localStorage.getItem("dashboard-theme");
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme")
      || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("dashboard-theme", next);
  });
})();
</script>

<script>
/* 数据渲染：3s 轮询 /api/snapshot，正交连线生长树 + 进化时间线 + 点卡联动。
   快照契约见 dashboard_data.build_snapshot；只读其产出字段，不编造数据。 */
(function () {
  "use strict";

  var POLL_MS = 3000;
  var $ = function (id) { return document.getElementById(id); };

  var snapshot = null;      // 最近一次成功拉取并渲染的快照
  var lastDrawn = null;     // 已渲染画面标识：generated_at 或 "no-run"
  var expanded = new Set(); // 展开的域名（页面内存，不持久化）
  var highlighted = null;   // 联动高亮：Set(域名) 或 null
  var highlightSrc = -1;    // 高亮来源事件下标（再点同一张取消）
  var pollTimer = null;
  var replayRound = null;   // 回放游标：null = 当前态；数字 = 停留的回放轮
  var playing = false;      // 播放中：650ms setTimeout 步进链
  var playTimer = null;     // 步进链当前定时器
  var scrubbing = false;    // 拖动游标跳转中
  var replayAnim = false;   // 本帧渲染带 stagger 生长动画（仅播放步进为真）
  var growSeq = 0;          // 本帧新生长节点序号 → stagger delay

  function fmt(v) { return v === null || v === undefined ? "—" : String(v); }

  function maxRounds() {
    return (snapshot && snapshot.status && snapshot.status.budget
      && snapshot.status.budget.max_rounds) || null;
  }

  function escapeHtml(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---- 回放 ----
  // 轮界只取 growth.rounds 的最大轮；无逐轮信息（run 级聚合/degraded）→
  // null：回放整体禁用（胶囊隐藏），不报错。
  function roundBounds() {
    var g = (snapshot && snapshot.growth) || {};
    if (g.granularity === "run") return null;
    var rounds = g.rounds || [];
    var maxTotal = 0, maxValid = 0;
    rounds.forEach(function (r) {
      if (r.round > maxTotal) maxTotal = r.round;
      if (r.status === "completed" && r.round > maxValid) maxValid = r.round;
    });
    return maxTotal ? { min: 1, max: maxTotal, valid: maxValid } : null;
  }

  function passesReplay(ev) {
    if (replayRound === null) return true;
    return ev.round !== null && ev.round !== undefined && ev.round <= replayRound;
  }

  // 回放视图：按 first_round 过滤域与模块；缺失 = 老数据，不因回放而隐藏。
  function viewDomains() {
    var domains = ((snapshot && snapshot.growth) || {}).domains || [];
    if (replayRound === null) return domains;
    return domains.filter(function (d) {
      return d.first_round === null || d.first_round === undefined
        || d.first_round <= replayRound;
    }).map(function (d) {
      var mods = d.modules || [];
      var keep = mods.filter(function (m) {
        return m.first_round === null || m.first_round === undefined
          || m.first_round <= replayRound;
      });
      return keep.length === mods.length ? d : Object.assign({}, d, { modules: keep });
    });
  }

  // stagger：仅播放步进帧生效；本轮新生长节点依次浮现——60ms 封顶 1.2s。
  function isBorn(round) {
    return replayAnim && replayRound !== null && round !== null
      && round !== undefined && round === replayRound;
  }
  function growAnim() {
    return "animation: grow-in .4s cubic-bezier(.22,1,.36,1) "
      + Math.min(growSeq++ * 60, 1200) + "ms backwards";
  }

  // ---- 轮询：3s 一拍；页面隐藏时跳过；画面未变不重渲染；失败静默保留旧画面 ----
  function schedule() { pollTimer = setTimeout(poll, POLL_MS); }

  var polling = false;

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      if (document.hidden) { polling = false; schedule(); return; }
      var res = await fetch("/api/snapshot");
      if (!res.ok) throw new Error("HTTP " + res.status);
      var next = await res.json();
      if (next && next.error === "no-run") {
        if (lastDrawn !== "no-run") { lastDrawn = "no-run"; renderNoRun(); }
      } else if (next && next.meta && next.meta.generated_at) {
        if (lastDrawn !== next.meta.generated_at) {
          var first = snapshot === null;
          snapshot = next;
          lastDrawn = next.meta.generated_at;
          highlighted = null; highlightSrc = -1;
          if (first && snapshot.growth && snapshot.growth.domains
              && snapshot.growth.domains.length) {
            expanded.add(snapshot.growth.domains[0].name);
          }
          renderAll();
        }
      }
    } catch (err) { /* 网络/解析失败：保留旧画面，不打断观察 */ }
    polling = false;
    schedule();
  }

  function renderNoRun() {
    $("norun").hidden = false;
    $("stage").style.display = "none";
    $("replay").hidden = true;
  }

  function renderAll() {
    $("norun").hidden = true;
    $("stage").style.display = "";
    renderStats();
    renderTree();
    renderEvents();
    renderDirections();
    renderTrend();
    renderLog();
    renderRetro();
    renderStatusPanel();
  }

  // 态势卡：所有小节都无数据时整卡隐藏，不留空壳
  function renderStatusPanel() {
    var ids = ["trend-sec", "dir-sec", "goal-sec", "retro-sec", "log-sec"];
    var any = false;
    for (var i = 0; i < ids.length; i++) {
      if (!$(ids[i]).hidden) { any = true; break; }
    }
    $("status-panel").hidden = !any;
  }

  // ---- 统计行 / 顶栏 / 目标 / 回放胶囊 ----
  function renderStats() {
    var st = (snapshot && snapshot.status) || {};
    var growth = (snapshot && snapshot.growth) || {};
    var domains = growth.domains || [];
    var meta = (snapshot && snapshot.meta) || {};
    var budget = st.budget || {};
    var goals = st.goals || {};
    var tokens = budget.estimated_tokens_used;
    if (tokens === null || tokens === undefined) tokens = 0;

    $("stat-runid").textContent = meta.run_id || "";
    var phase = st.phase;
    $("stat-phase").className = phase === "running" ? "live" : "";
    $("stat-phase").textContent = phase === "running" ? "运行中"
      : (phase === "finished" ? "已完成" : "—");
    $("stat-version").textContent = meta.skill_version
      ? "v" + meta.skill_version : "";

    var max = maxRounds();
    $("stat-rounds-big").innerHTML = escapeHtml(fmt(st.round_seq))
      + (max ? "<small> / " + escapeHtml(max) + "</small>" : "");
    $("stat-completed").textContent = fmt(st.completed_rounds);
    var modules = 0;
    domains.forEach(function (d) { modules += (d.modules || []).length; });
    $("stat-scale").innerHTML = domains.length + "<small> 域 · " + modules + " 模块</small>";
    $("stat-tokens").innerHTML = (tokens / 1000).toFixed(1) + "<small>k</small>";

    // 粒度诚实标签：粗粒度口径只在不等价时出现，一词说明
    var tag = $("gran-tag");
    if (growth.granularity === "run") { tag.hidden = false; tag.textContent = "run 级聚合"; }
    else if (growth.granularity === "per-round-files") { tag.hidden = false; tag.textContent = "按文件归因"; }
    else tag.hidden = true;

    // 目标：total 为 0/缺省时整块隐藏，不渲染 0/0 空壳
    var goalSec = $("goal-sec");
    if (goals.total) {
      goalSec.hidden = false;
      $("goal-label").textContent = "目标 " + fmt(goals.met) + "/" + fmt(goals.total);
      $("goal-fill").style.width = Math.max(0, Math.min(100,
        goals.met / goals.total * 100)) + "%";
      $("goal-side").textContent = "待办 " + fmt(st.backlog ? st.backlog.pending : null)
        + " · 波次 " + fmt(st.expansion_waves);
    } else goalSec.hidden = true;

    // 回放胶囊：无逐轮数据（含 degraded）→ 整体隐藏，不出死控件
    var bounds = roundBounds();
    $("replay").hidden = !bounds;
    if (bounds) {
      $("axis-label").textContent = "r1 — r" + bounds.max;
      var cur = $("axis-cursor");
      if (replayRound === null) {
        $("axis-fill").style.width = Math.min(100, bounds.valid / bounds.max * 100) + "%";
        cur.style.right = "0%";
      } else {
        var span = bounds.max - bounds.min || 1;
        var pct = Math.min(100, Math.max(0, (replayRound - bounds.min) / span * 100));
        $("axis-fill").style.width = pct + "%";
        cur.style.right = (100 - pct) + "%";
      }
    }
  }

  // ---- 树布局器：正交连线（禁止贝塞尔绕圈）----
  // 根固定 (84,36)；主干 x=84；域枝水平出枝到 (152, y)；展开域下挂二级竖线，
  // 模块出枝到 (175, my)。节奏放大：折叠 64 / 展开 66+28m+20 / 模块距 28。
  function layoutTree(domains) {
    var nodes = [{ kind: "root", x: 84, y: 36 }];
    var edges = [];
    var y = 96;
    var trunkEnd = 46;
    domains.forEach(function (d) {
      var mods = (expanded.has(d.name) && d.modules) || [];
      edges.push({ kind: "branch", x1: 84, y1: y, x2: 152, y2: y,
        w: Math.round((1.2 + 2.0 * (d.weight || 0)) * 100) / 100, domainName: d.name });
      nodes.push({ kind: "domain", x: 152, y: y, domain: d, open: mods.length > 0 });
      if (mods.length) {
        edges.push({ kind: "hang", x1: 152, y1: y + 8, x2: 152,
          y2: y + 38 + 28 * (mods.length - 1), w: 1.2, domainName: d.name });
        mods.forEach(function (m, j) {
          var my = y + 38 + 28 * j;
          edges.push({ kind: "module", x1: 152, y1: my, x2: 175, y2: my, w: 1.2,
            domainName: d.name, j: j });
          nodes.push({ kind: "module", x: 175, y: my, module: m, domainName: d.name, j: j });
        });
      }
      trunkEnd = y;
      y += mods.length ? 66 + 28 * mods.length + 20 : 64;
    });
    return { nodes: nodes, edges: edges, trunkEnd: trunkEnd };
  }

  // SVG 文本防裁切：data-max 给出该行可用宽度（svg 宽 − 起点 x − 边距），
  // 实测超宽则逐字去尾加省略号。getComputedTextLength 量真实字形宽，中英混排也准。
  function fitSvgTexts(svg) {
    if (!svg) return;
    var texts = svg.querySelectorAll("text[data-max]");
    for (var i = 0; i < texts.length; i++) {
      var t = texts[i];
      var max = parseFloat(t.getAttribute("data-max"));
      var txt;
      try { if (t.getComputedTextLength() <= max) continue; txt = t.textContent; }
      catch (err) { continue; }
      while (txt.length > 1) {
        txt = txt.slice(0, -1);
        t.textContent = txt + "…";
        try { if (t.getComputedTextLength() <= max) break; } catch (err2) { return; }
      }
    }
  }

  function renderTree() {
    var box = $("tree");
    if (!snapshot) return;
    var growth = snapshot.growth || {};
    var meta = snapshot.meta || {};
    if (!growth.domains || (meta.degraded || []).indexOf("growth") >= 0) {
      box.innerHTML = '<div style="color:var(--txt3);font-size:12.5px;padding:26px 2px">'
        + "进化树不可用：本轮次记录缺少提交锚点</div>";
      return;
    }
    var domains = viewDomains();
    var t = layoutTree(domains);
    // 宽度跟面板走（不再设 560 下限）：窄面板靠文本截断适配，宽了也不浪费
    var w = Math.max(box.clientWidth || 0, 300);
    var byDomain = {};
    t.nodes.forEach(function (n) {
      if (n.kind === "domain") byDomain[n.domain.name] = { y: n.y, open: n.open, branch: null, hang: null, modules: [] };
      else if (n.kind === "module") byDomain[n.domainName].modules[n.j] = { node: n };
    });
    t.edges.forEach(function (e) {
      var row = byDomain[e.domainName];
      if (!row) return;
      if (e.kind === "branch") row.branch = e;
      else if (e.kind === "hang") row.hang = e;
      else row.modules[e.j] = { edge: e, node: row.modules[e.j].node };
    });

    var running = (snapshot.status || {}).phase === "running";
    var s = '<svg width="' + w + '" height="' + (t.trunkEnd + 40)
      + '" role="img" aria-label="项目生长树">';
    s += '<path d="M 84 46 L 84 ' + t.trunkEnd + '" stroke="var(--line)" stroke-width="2" fill="none"/>';
    if (running) {
      s += '<circle class="halo" cx="84" cy="36" r="11" fill="none" stroke="var(--accent)" stroke-width="1"/>';
    }
    s += '<circle cx="84" cy="36" r="5" fill="var(--txt)"/>';
    domains.forEach(function (d) {
      var row = byDomain[d.name];
      if (!row) return;
      var y = row.y;
      s += '<g class="domain" data-domain="' + escapeHtml(d.name) + '">'
        + (isBorn(d.first_round)
          ? '<g class="drow grow" style="' + growAnim() + '">'
          : '<g class="drow">');
      s += '<path class="branch" d="M ' + row.branch.x1 + " " + row.branch.y1
        + " L " + row.branch.x2 + " " + row.branch.y2
        + '" stroke="var(--line)" stroke-width="' + row.branch.w + '" fill="none"/>';
      s += '<circle class="dot" cx="152" cy="' + y + '" r="4.5" fill="var(--txt3)"/>';
      s += '<text data-max="' + (w - 206) + '" x="166" y="' + (y + 4)
        + '" font-size="12" font-weight="600" fill="var(--txt)">'
        + escapeHtml(d.name) + '</text>';
      var note = [];
      if (d.first_round !== null && d.first_round !== undefined) note.push("r" + escapeHtml(d.first_round));
      if (d.meaning) note.push(escapeHtml(d.meaning));
      // 注释列固定从 x=284 起：窄面板放不下（剩 ~120px 以下）时整段省略，防溢出被裁
      if (note.length && w - 284 > 120) {
        s += '<text class="mono" data-max="' + (w - 290) + '" x="284" y="' + (y + 4)
          + '" font-size="10" fill="var(--txt3)">'
          + note.join(" · ") + '</text>';
      }
      if (!row.open && (d.modules || []).length) {
        s += '<text class="mono" x="' + (w - 32) + '" y="' + (y + 3.5)
          + '" font-size="10" fill="var(--txt3)" text-anchor="end">⋯</text>';
      }
      s += "</g>";
      if (row.open && row.hang) {
        var m0 = (d.modules || [])[0];
        var hangAttr = isBorn(m0 && m0.first_round)
          ? ' class="grow" style="' + growAnim() + '"' : "";
        s += '<path' + hangAttr + ' d="M ' + row.hang.x1 + " " + row.hang.y1 + " L " + row.hang.x2 + " " + row.hang.y2
          + '" stroke="var(--line)" stroke-width="' + row.hang.w + '" fill="none"/>';
        (d.modules || []).forEach(function (m, j) {
          var mm = row.modules[j];
          if (!mm) return;
          var fresh = isBorn(m.first_round);
          var anim = fresh ? growAnim() : "";
          var attr = fresh ? ' class="grow" style="' + anim + '"' : "";
          s += '<path' + attr + ' d="M ' + mm.edge.x1 + " " + mm.edge.y1 + " L " + mm.edge.x2 + " " + mm.edge.y2
            + '" stroke="var(--line)" stroke-width="1.2" fill="none"/>';
          s += '<circle' + attr + ' cx="175" cy="' + mm.node.y + '" r="3" fill="var(--txt3)"/>';
          var born = (m.first_round === null || m.first_round === undefined) ? ""
            : '<tspan fill="var(--txt3)"> · r' + escapeHtml(m.first_round) + '</tspan>';
          s += '<text class="mono' + (fresh ? " grow" : "") + '"'
            + (fresh ? ' style="' + anim + '"' : "") + ' data-max="' + (w - 196)
            + '" x="188" y="' + (mm.node.y + 3.5)
            + '" font-size="11" fill="var(--txt2)">' + escapeHtml(m.name) + born + '</text>';
        });
      }
      s += "</g>";
    });
    s += "</svg>";
    box.innerHTML = s;
    fitSvgTexts(box.querySelector("svg"));
    applyHighlight();
  }

  // ---- 联动：点卡片 → 该轮域枝 accent 全亮，其余 opacity .35 ----
  // 只改既有 DOM 的 style，不重建树——CSS transition 承担 200ms 渐变。
  function applyHighlight() {
    var svg = $("tree").querySelector("svg");
    if (!svg) return;
    var growth = (snapshot && snapshot.growth) || {};
    var maxRound = 0;
    (growth.rounds || []).forEach(function (r) { if (r.round > maxRound) maxRound = r.round; });
    svg.querySelectorAll("g.domain").forEach(function (g) {
      var name = g.getAttribute("data-domain");
      var d = null;
      (growth.domains || []).forEach(function (x) { if (x.name === name) d = x; });
      var acts = d ? (d.active_rounds || []).filter(function (r) {
        return r !== null && r !== undefined;
      }) : [];
      var accent = (replayRound !== null
          ? acts.indexOf(replayRound) >= 0
          : (acts.length > 0 && Math.max.apply(null, acts) === maxRound))
        || (highlighted !== null && highlighted.has(name));
      g.style.opacity = (!highlighted || highlighted.has(name)) ? "1" : "0.35";
      var branch = g.querySelector(".branch");
      if (branch) branch.style.stroke = accent ? "var(--accent)" : "";
      var dot = g.querySelector(".dot");
      if (dot) dot.style.fill = accent ? "var(--accent)" : "";
    });
  }

  // ---- 进化时间线：最新在上；最近一条 completed 热卡；取消/中止灰卡。
  // 批量提交轮（flush）不逐轮成卡——相邻折叠为一根细分隔线，只留锚点信息。 ----
  function isFlush(ev) {
    return ev && ev.title && /提交轮/.test(ev.title);
  }
  function flushLabel(ev) {
    var m = /flush\s*[^（(\n]*/i.exec(ev.title || "");
    return m ? m[0].replace(/\s+$/, "") : "批量提交";
  }

  function renderEvents() {
    var evs = (snapshot && snapshot.growth && snapshot.growth.events) || [];
    var EVENTS_RENDER_LIMIT = 20;
    var offset = Math.max(0, evs.length - EVENTS_RENDER_LIMIT);
    var render = offset ? evs.slice(offset) : evs;
    var hot = false;
    var rows = [];
    var i = render.length - 1;
    while (i >= 0) {
      var ev = render[i];
      if (isFlush(ev)) {
        var group = [];
        var newest = null;
        var bornAny = false;
        while (i >= 0 && isFlush(render[i])) {
          var f = render[i];
          if (passesReplay(f)) {
            if (!newest) newest = f;
            group.push(f);
            if (isBorn(f.round)) bornAny = true;
          }
          i--;
        }
        if (group.length) {
          rows.push('<div class="flush mono' + (bornAny ? " grow" : "") + '"'
            + (bornAny ? ' style="' + growAnim() + '"' : "") + "><i></i><span>"
            + escapeHtml(flushLabel(newest))
            + (group.length > 1 ? " · " + group.length + " 轮" : "")
            + "</span><i></i></div>");
        }
        continue;
      }
      if (!passesReplay(ev)) { i--; continue; }
      var cls = "ev";
      if (!hot && ev.status === "completed") { cls += " hot"; hot = true; }
      if (ev.status === "cancelled" || ev.status === "aborted") cls += " dim";
      var fresh = isBorn(ev.round);
      if (fresh) cls += " grow";
      var meta = [];
      if (ev.round !== null && ev.round !== undefined) meta.push("r" + ev.round);
      if (ev.score !== null && ev.score !== undefined) meta.push("自评 " + ev.score + "/5");
      if (ev.domains && ev.domains.length) meta.push(ev.domains.join("、"));
      var full = ((ev.title || "") + "\n" + (ev.summary || "")).replace(/\n+/g, " ").trim();
      rows.push('<div class="' + cls + '" data-ev="' + (offset + i) + '"'
        + (full ? ' title="' + escapeHtml(full) + '"' : "")
        + (fresh ? ' style="' + growAnim() + '"' : "") + '>'
        + '<div class="meta mono">' + escapeHtml(meta.join(" · ")) + '</div>'
        + (ev.title ? '<div class="t">' + escapeHtml(ev.title) + '</div>' : "")
        + (ev.summary ? '<div class="s">' + escapeHtml(ev.summary) + '</div>' : "")
        + "</div>");
      i--;
    }
    $("events").innerHTML = rows.join("");
  }

  // ---- 迭代方向：价值序待办；空供给时整块隐藏，不渲染占位文案 ----
  function renderDirections() {
    var cands = ((snapshot && snapshot.status && snapshot.status.backlog) || {}).candidates || [];
    $("dir-sec").hidden = !cands.length;
    if (!cands.length) return;
    $("dir-cnt").textContent = "· " + cands.length;
    $("directions").innerHTML = cands.map(function (c) {
      return '<div class="dirrow">'
        + '<span class="ve mono">v' + fmt(c.value) + " e" + fmt(c.effort) + "</span>"
        + "<span>" + escapeHtml(c.title || "") + "</span>"
        + '<span class="ty mono">' + escapeHtml(c.type || "") + "</span></div>";
    }).join("");
  }

  // ---- 趋势：自评分（0-5 定标）/ 文件数双折线；不足两轮整块隐藏 ----
  function renderTrend() {
    var rounds = ((snapshot && snapshot.growth) || {}).rounds || [];
    var pts = rounds.filter(function (r) {
      return r && (r.score !== null || r.files_changed > 0);
    });
    if (pts.length < 2) { $("trend-sec").hidden = true; return; }
    $("trend-sec").hidden = false;
    var W = 520, H = 56, pad = 5;
    var maxFiles = 1;
    pts.forEach(function (r) { if (r.files_changed > maxFiles) maxFiles = r.files_changed; });
    var px = function (i) { return pad + i * ((W - 2 * pad) / (pts.length - 1)); };
    var line = function (values, max) {
      return values.map(function (v, i) {
        return px(i).toFixed(1) + "," + (H - pad - v / max * (H - 2 * pad)).toFixed(1);
      }).join(" ");
    };
    var scores = pts.map(function (r) { return r.score === null ? 0 : r.score; });
    var files = pts.map(function (r) { return r.files_changed; });
    $("trend").innerHTML =
      '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;display:block">'
      + '<polyline points="' + line(files, maxFiles)
      + '" fill="none" stroke="var(--txt3)" stroke-width="1.2" stroke-dasharray="4 3"><title>文件数</title></polyline>'
      + '<polyline points="' + line(scores, 5)
      + '" fill="none" stroke="var(--accent)" stroke-width="1.5"><title>自评分（0-5）</title></polyline>'
      + "</svg>";
  }

  // ---- 运行事件：log.jsonl 尾部几条；空则隐藏 ----
  function renderLog() {
    var log = (snapshot && snapshot.narrative && snapshot.narrative.recent_events) || [];
    $("log-sec").hidden = !log.length;
    if (!log.length) return;
    $("events-log").innerHTML = log.slice(-6).reverse().map(function (e) {
      var cls = e.status === "error" ? "err" : "";
      return '<div><span class="' + cls + '">' + escapeHtml(e.event || "?")
        + "</span> " + escapeHtml(e.status || "") + " "
        + escapeHtml((e.ts || "").replace("T", " ").slice(0, 19)) + "</div>";
    }).join("");
  }

  // ---- 回顾：run 结束后的 retrospective 摘要；剥掉 Markdown 记号，只留净文本 ----
  function renderRetro() {
    var narrative = (snapshot && snapshot.narrative) || {};
    if (narrative.retrospective_exists && narrative.retrospective_excerpt) {
      var txt = String(narrative.retrospective_excerpt)
        .replace(/^#+\s*/gm, "").replace(/^[-*]\s+/gm, "")
        .replace(/[`*>_]/g, "").replace(/\n{2,}/g, "\n").trim();
      $("retro-excerpt").textContent = txt;
      $("retro-sec").hidden = false;
    } else $("retro-sec").hidden = true;
  }

  // ---- 交互绑定（事件委托，DOM 重建不失效）----
  $("tree").addEventListener("click", function (e) {
    var row = e.target.closest(".drow");
    if (!row) return;
    var g = row.closest("g.domain");
    var name = g && g.getAttribute("data-domain");
    if (!name) return;
    if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
    renderTree();
  });

  $("events").addEventListener("click", function (e) {
    var card = e.target.closest(".ev");
    if (!card || !snapshot) return;
    var idx = Number(card.getAttribute("data-ev"));
    var ev = ((snapshot.growth || {}).events || [])[idx];
    if (!ev || !ev.domains || !ev.domains.length) return;
    if (highlightSrc === idx) { highlighted = null; highlightSrc = -1; }
    else { highlighted = new Set(ev.domains); highlightSrc = idx; }
    renderEvents();
    applyHighlight();
  });

  // ---- 回放控制：▶ 从 r1 逐轮生长（650ms/轮）；再点回当前态；
  // 拖动游标跳任意轮；播完自动回当前态 ----
  function stepTo(r) {
    replayRound = r;
    $("mode-label").textContent = "回放 r" + r;
    replayAnim = true;
    growSeq = 0;
    renderAll();
    replayAnim = false;
  }

  function scheduleStep() {
    playTimer = setTimeout(function () {
      var b = roundBounds();
      if (!b || replayRound >= b.max) { exitReplay(); return; }
      stepTo(replayRound + 1);
      scheduleStep();
    }, 650);
  }

  function exitReplay() {
    clearTimeout(playTimer);
    playTimer = null;
    playing = false;
    replayRound = null;
    $("play").textContent = "▶";
    $("mode-label").textContent = "当前";
    renderAll();
  }

  function startReplay() {
    var b = roundBounds();
    if (!b) return;
    clearTimeout(playTimer);
    playing = true;
    $("play").textContent = "⏸";
    stepTo(b.min);
    scheduleStep();
  }

  $("play").addEventListener("click", function () {
    if (playing) { exitReplay(); return; }
    startReplay();
  });

  // 游标拖动：按百分比映射 r1..rMax，即时重渲染（无动画），释放停留回放态
  var axis = $("axis");
  function scrubTo(e) {
    var b = roundBounds();
    if (!b) return;
    var rect = axis.getBoundingClientRect();
    var p = rect.width ? (e.clientX - rect.left) / rect.width : 0;
    p = Math.max(0, Math.min(1, p));
    var r = b.min + Math.round(p * (b.max - b.min));
    if (r === replayRound) return;
    replayRound = r;
    $("mode-label").textContent = "回放 r" + r;
    renderAll();
  }
  axis.addEventListener("pointerdown", function (e) {
    if (!roundBounds()) return;
    if (playing) {
      clearTimeout(playTimer);
      playTimer = null;
      playing = false;
      $("play").textContent = "▶";
    }
    scrubbing = true;
    e.preventDefault();
    if (axis.setPointerCapture) {
      try { axis.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
    scrubTo(e);
  });
  axis.addEventListener("pointermove", function (e) { if (scrubbing) scrubTo(e); });
  axis.addEventListener("pointerup", function () { scrubbing = false; });
  axis.addEventListener("pointercancel", function () { scrubbing = false; });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { clearTimeout(pollTimer); poll(); }
  });
  window.addEventListener("resize", function () { if (snapshot) renderTree(); });

  poll();
})();
</script>

</body>
</html>
