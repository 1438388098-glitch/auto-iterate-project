name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The helper code targets Python 3.6+ (str.format conventions, no
        # 3.7+ syntax), but hosted runners cannot install 3.6/3.7 — the
        # documented support line is "3.6+ (CI-verified on 3.8-3.13)".
        python-version: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        # 测试运行器自身也要过编译门（1.12 轮实测：对它的改动此前只能靠
        # smoke 步骤才暴露语法错误）
        run: python -m py_compile scripts/autopilot_state.py scripts/autopilot/*.py scripts/test_autopilot_state.py
        # Windows runner 默认 PowerShell 不展开 glob，通配符会以字面量传给 py_compile
        shell: bash
      - name: Parallel smoke check
        run: python scripts/test_autopilot_state.py --jobs 4 --smoke
      - name: Run test suite
        run: python scripts/test_autopilot_state.py
